<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Donate Overlay · OBS</title>
  <link rel="icon" href="/img/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/logo-180.png">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }

    /* แจ้งเตือนเรียงจากบนลงล่าง: อันใหม่ต่อท้ายด้านล่าง อันเก่าหมดเวลาแล้วยุบหาย อันที่เหลือเลื่อนขึ้นแทน */
    #stack {
      position: fixed; left: 50%; top: 6%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center;
      max-height: 92vh; overflow: hidden;
    }
    .alert {
      box-sizing: border-box; min-width: 420px; max-width: 72vw; padding: 22px 30px; border-radius: 20px;
      background: var(--bg, transparent); color: var(--text, #fff); text-align: center;
      margin-bottom: 14px; overflow: hidden;
      opacity: 0; transform: translateY(-30px);
      transition: opacity .4s ease, transform .4s ease, max-height .45s ease, margin .45s ease, padding .45s ease;
    }
    .alert.show { opacity: 1; transform: translateY(0); }
    .alert.leaving { opacity: 0; transform: translateY(-12px); max-height: 0 !important; margin-bottom: 0; padding-top: 0; padding-bottom: 0; }
    .alert .title { font-size: 38px; line-height: 1.25; font-weight: 800; color: var(--accent, #ffffff); text-shadow: 0 2px 4px rgba(0, 0, 0, .5), 0 4px 16px rgba(0, 0, 0, .5); }
    .alert .msg { font-size: 30px; line-height: 1.4; opacity: .97; margin-top: 10px; word-wrap: break-word; text-shadow: 0 2px 4px rgba(0, 0, 0, .55), 0 3px 12px rgba(0, 0, 0, .6); }
    .alert .msg:empty { display: none; }
    /* รูป/GIF เหนือข้อความ — สตรีมเมอร์เลือกขนาดได้ (เล็ก / กลาง / ใหญ่) */
    .alert .gif {
      display: block; width: auto; height: auto; max-width: 220px; max-height: 220px; margin: 0 auto 16px;
      border-radius: 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); object-fit: contain;
    }
    .alert .gif.size-medium { max-width: 420px; max-height: 300px; }
    .alert .gif.size-large { max-width: min(760px, 64vw); max-height: 430px; }

    /* ส่งสติกเกอร์: รูปสติกเกอร์ตัวใหญ่บานขึ้นมาเหนือหัวข้อ */
    .alert .big-sticker { display: block; font-size: 96px; line-height: 1; margin: 0 auto 10px; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, .45)); }
    .alert .big-sticker img { width: 120px; height: auto; display: block; margin: 0 auto; }
    .alert.show .big-sticker { animation: bloom 1s cubic-bezier(.2, 1.6, .4, 1) both, sway 2.4s ease-in-out 1s infinite; }
    @keyframes bloom { 0% { transform: scale(0) rotate(-120deg); opacity: 0 } 100% { transform: scale(1) rotate(0); opacity: 1 } }
    @keyframes sway  { 0%, 100% { transform: rotate(-8deg) } 50% { transform: rotate(8deg) } }

    .layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .st { position: absolute; will-change: transform, opacity; }
    .st img { width: 72px; height: auto; display: block; }

    @keyframes float  { 0% { transform: translateY(20px); opacity: 0 } 12% { opacity: 1 } 100% { transform: translateY(-112vh); opacity: 0 } }
    @keyframes rain   { 0% { transform: translateY(-20vh) rotate(0); opacity: 0 } 12% { opacity: 1 } 100% { transform: translateY(115vh) rotate(360deg); opacity: 0 } }
    @keyframes bounce { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-70px) } }
    @keyframes zoom   { 0% { transform: scale(0); opacity: 0 } 20% { transform: scale(1.4); opacity: 1 } 60% { transform: scale(1) } 100% { transform: scale(2.4); opacity: 0 } }
    @keyframes spin   { 0% { transform: rotate(0) scale(0) } 20% { transform: rotate(180deg) scale(1.2) } 100% { transform: rotate(1440deg) scale(0); opacity: 0 } }
    @keyframes fly    { 0% { transform: translate(-24vw, 22vh) rotate(-18deg); opacity: 0 } 10% { opacity: 1 } 100% { transform: translate(124vw, -62vh) rotate(18deg); opacity: 0 } }
    /* กลีบดอกไม้โปรยลงมา ส่ายซ้ายขวาระหว่างตก (--dx = ระยะส่ายของแต่ละกลีบ) */
    @keyframes petals {
      0%   { transform: translate(0, -15vh) rotate(0); opacity: 0 }
      8%   { opacity: 1 }
      25%  { transform: translate(var(--dx), 18vh) rotate(90deg) }
      50%  { transform: translate(calc(var(--dx) * -1), 50vh) rotate(200deg) }
      75%  { transform: translate(var(--dx), 82vh) rotate(290deg); opacity: 1 }
      100% { transform: translate(0, 118vh) rotate(380deg); opacity: 0 }
    }
    @keyframes shake  { 0%, 100% { transform: translateX(0) } 20% { transform: translateX(-34px) } 40% { transform: translateX(30px) } 60% { transform: translateX(-22px) } 80% { transform: translateX(18px) } }
  </style>
</head>
<body>
  <div class="layer" id="layer"></div>
  <div id="stack"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const key = location.pathname.split('/').filter(Boolean).pop();
    const stack = document.getElementById('stack');
    const layer = document.getElementById('layer');
    let cfg = { accent: '#ffffff', text: '#fff', bg: 'transparent', duration: 8000, sound: true, tts: false, tts_lang: 'th-TH' };
    // แสดงพร้อมกันได้สูงสุดกี่อัน — เกินนี้รอคิวจนกว่าอันบนสุดจะหายไป
    const MAX_VISIBLE = 4;
    let queue = [], visible = 0;

    fetch('/api/public/overlay/' + key)
      .then((r) => r.json())
      .then((d) => {
        if (d.error) { document.body.innerHTML = '<p style="color:#f87171;font-family:sans-serif">Overlay key ไม่ถูกต้อง</p>'; return; }
        cfg = Object.assign(cfg, d.settings);
      })
      .catch(() => {});

    function applyVars(el, s) {
      el.style.setProperty('--bg', s.bg);
      el.style.setProperty('--text', s.text);
      el.style.setProperty('--accent', s.accent);
    }

    const socket = io();
    // OBS ไม่รีโหลด Browser Source เอง — ถ้าเชื่อมต่อใหม่หลังเซิร์ฟเวอร์รีสตาร์ท (มักเป็นตอนอัปเดตระบบ)
    // ให้โหลดหน้าใหม่ จะได้ใช้โค้ด Overlay เวอร์ชันล่าสุดโดยไม่ต้องกด Refresh ใน OBS เอง
    let connectedOnce = false;
    socket.on('connect', () => {
      if (connectedOnce) { location.reload(); return; }
      connectedOnce = true;
      socket.emit('overlay:join', key);
    });
    socket.on('overlay:error', () => console.warn('overlay key invalid'));
    socket.on('donation', (d) => {
      if (d.settings && d.settings.show === false) return;
      queue.push(d);
      pump();
    });

    function pump() {
      while (visible < MAX_VISIBLE && queue.length) showAlert(queue.shift());
    }

    function showAlert(d) {
      visible++;
      const s = Object.assign({}, cfg, d.settings || {});
      const card = document.createElement('div');
      card.className = 'alert';
      applyVars(card, s);

      if (s.gif_url) {
        const gif = document.createElement('img');
        gif.className = 'gif size-' + (['small', 'medium', 'large'].includes(s.gif_size) ? s.gif_size : 'large');
        gif.alt = ''; gif.src = s.gif_url;
        card.append(gif);
      }
      if (d.sticker_only && d.sticker) {
        const big = document.createElement('div');
        big.className = 'big-sticker';
        if (d.sticker.image_url) { const im = document.createElement('img'); im.src = d.sticker.image_url; big.append(im); }
        else big.textContent = d.sticker.emoji || '⭐';
        card.append(big);
      }
      const title = document.createElement('div');
      title.className = 'title';
      renderTitle(title, s, d);
      const msg = document.createElement('div');
      msg.className = 'msg';
      msg.textContent = d.message || '';
      card.append(title, msg);

      stack.append(card);
      // เฟรมถัดไปค่อยใส่ .show เพื่อให้ transition เลื่อนเข้าทำงาน
      requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('show')));

      if (d.sticker) spawnStickers(d.sticker);
      if (s.sound) playSound(s.custom_sound_url);
      // เสียง AI (ไฟล์ MP3 ที่เซิร์ฟเวอร์สร้างไว้แล้ว) เข้าคิวเดียวกับคลิปเสียงอื่น ไม่อ่านซ้อนกัน — ไม่มีไฟล์ค่อยใช้เสียงของเบราว์เซอร์
      if (s.tts && s.tts_url) queueClip(s.tts_url);
      else if (s.tts && 'speechSynthesis' in window) speakTts(s, d);
      if (d.voice_url) queueClip(d.voice_url);
      else if (d.audio_url) queueClip(d.audio_url);

      const dur = Math.max(2500, Number(s.duration) || 8000);
      setTimeout(() => {
        // ล็อกความสูงปัจจุบันก่อน แล้วยุบเป็น 0 — อันที่อยู่ด้านล่างจะเลื่อนขึ้นมาแบบนุ่ม ๆ
        card.style.maxHeight = card.offsetHeight + 'px';
        void card.offsetHeight;
        card.classList.add('leaving');
        // ปิดไว้ตามค่าเริ่มต้น TTS จะอ่านต่อจนจบแม้ป๊อปอัพหายไปแล้ว — ถ้าสตรีมเมอร์สั่งให้หยุดทันที ค่อยตัดเสียงตรงนี้
        if (s.tts_persist_after_hide === false) {
          if (s.tts_url) stopClip(s.tts_url);
          else if ('speechSynthesis' in window) speechSynthesis.cancel();
        }
        setTimeout(() => { card.remove(); visible--; pump(); }, 500);
      }, dur);
    }

    // คลิปเสียงพูด/ไฟล์เสียงของผู้ชม เล่นทีละคลิปตามลำดับ ไม่ให้ซ้อนกันเมื่อมีหลายแจ้งเตือนพร้อมกัน
    const clipQueue = [];
    let current = null; // { url, audio, done }
    function queueClip(url) { clipQueue.push(url); nextClip(); }
    function nextClip() {
      if (current || !clipQueue.length) return;
      const url = clipQueue.shift();
      let finished = false;
      const done = () => { if (finished) return; finished = true; current = null; nextClip(); };
      try {
        const a = new Audio(url);
        current = { url, audio: a, done };
        a.onended = done; a.onerror = done;
        a.play().catch(done);
      } catch (_) { done(); }
    }
    // หยุดคลิปนี้ (ทั้งที่กำลังเล่นหรือยังรอคิว) — ใช้กับเสียง AI เมื่อสตรีมเมอร์ปิด "อ่านต่อหลังแจ้งเตือนหาย"
    function stopClip(url) {
      const i = clipQueue.indexOf(url);
      if (i >= 0) clipQueue.splice(i, 1);
      if (current && current.url === url) { current.audio.pause(); current.done(); }
    }

    // แยกสีคำในหัวข้อแจ้งเตือน: {name}/{amount}/{currency} ใช้สี accent (ชื่อ+จำนวนเงิน), ข้อความที่เหลือ (เช่น "โดเนท") ใช้สี connector
    function renderTitle(el, s, d) {
      // ส่งสติกเกอร์อย่างเดียว: "{ชื่อผู้ส่ง} ส่งสติกเกอร์ {ชื่อสติกเกอร์} {อีโมจิ}"
      if (d.sticker_only && d.sticker) {
        el.innerHTML = '';
        const part = (text, color) => { const sp = document.createElement('span'); sp.textContent = text; sp.style.color = color; el.append(sp); };
        part(d.display_name, s.accent);
        part(' ส่งสติกเกอร์ ', s.connector || s.accent);
        part((d.sticker.name || '') + ' ' + (d.sticker.emoji || ''), s.accent);
        return;
      }
      const template = s.title_template;
      if (!template) { el.textContent = s.title || ''; return; }

      const currency = s.show_currency === false ? '' : '฿';
      const amountText = Number(d.amount).toLocaleString('th-TH');
      el.innerHTML = '';
      template.split(/(\{name\}|\{amount\}|\{currency\})/g).filter((x) => x !== '').forEach((part) => {
        const span = document.createElement('span');
        if (part === '{name}') { span.textContent = d.display_name; span.style.color = s.accent; }
        else if (part === '{amount}') { span.textContent = amountText; span.style.color = s.accent; }
        else if (part === '{currency}') { span.textContent = currency; span.style.color = s.accent; }
        else { span.textContent = part; span.style.color = s.connector || s.accent; }
        el.append(span);
      });
    }

    function playClip(url) {
      try { new Audio(url).play().catch(() => {}); } catch (_) {}
    }

    let ttsVoices = [];
    if ('speechSynthesis' in window) {
      const loadVoices = () => { ttsVoices = speechSynthesis.getVoices(); };
      loadVoices();
      speechSynthesis.onvoiceschanged = loadVoices;
    }
    // ประโยคที่อ่านออกเสียง เช่น "test โดเนท 20 บาท aaaaaaa"
    // ต้องตรงกับ speechText() ใน src/tts.js (เสียง AI)
    function speechText(s, d) {
      // ลำดับตายตัวทุกกรณี (รวมส่งสติกเกอร์): ชื่อผู้ส่ง → "โดเนท" → จำนวนเงิน + "บาท" → ข้อความ (ไม่อิงรูปแบบหัวข้อบนจอ)
      const head = `${d.display_name || 'ไม่ระบุชื่อ'} โดเนท ${Number(d.amount).toLocaleString('th-TH')} บาท`;
      // ฿ ในข้อความอ่านเป็น "บาท" (100฿ / ฿100 → 100 บาท)
      let msg = String(d.message || '').replace(/฿\s*(\d[\d,.]*)/g, '$1 บาท').replace(/฿/g, ' บาท ');
      // ถ้าปิด "อ่านสัญลักษณ์พิเศษ" ไว้ ให้ตัดสัญลักษณ์ที่มักสร้างปัญหาการอ่านออก (@ ~ # * เป็นต้น) ก่อนส่งให้ TTS
      if (s.tts_read_symbols === false) msg = msg.replace(/[@~#*_^`|\\]/g, '');
      // ส่งสติกเกอร์อย่างเดียวไม่มีข้อความ — อ่านชื่อสติกเกอร์แทน
      if (d.sticker_only && d.sticker && !msg) msg = 'สติกเกอร์ ' + (d.sticker.name || '');
      return `${head} ${msg}`.replace(/\s+/g, ' ').trim();
    }
    function speakTts(s, d) {
      try {
        const u = new SpeechSynthesisUtterance(speechText(s, d));
        u.lang = s.tts_lang || 'th-TH';
        // เลือกเสียงพากย์ตามชื่อที่สตรีมเมอร์ตั้งไว้ — เสียงที่มีจริงขึ้นกับเบราว์เซอร์/ระบบที่รัน OBS Browser Source
        // ถ้าไม่เจอเสียงที่ตั้งไว้ (เช่น OBS ไม่มีเสียงนั้นติดตั้ง) จะ fallback ไปใช้เสียง default ของ tts_lang แทนอัตโนมัติ
        if (s.tts_voice_name) {
          const v = ttsVoices.find((x) => x.name === s.tts_voice_name);
          if (v) u.voice = v;
        }
        speechSynthesis.speak(u);
      } catch (_) {}
    }

    function spawnStickers(st) {
      const anim = st.animation || 'float';
      const count = anim === 'petals' ? 34 : anim === 'rain' ? 26 : anim === 'float' ? 16 : anim === 'fly' ? 10 : 8;
      for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'st';
        if (st.image_url) {
          const img = document.createElement('img');
          img.src = st.image_url;
          s.append(img);
        } else {
          s.textContent = st.emoji || '⭐';
          s.style.fontSize = (44 + Math.random() * 46) + 'px';
        }
        s.style.left = (Math.random() * 92) + 'vw';
        s.style.top = (anim === 'rain' || anim === 'petals' ? -10 : 55 + Math.random() * 35) + 'vh';
        if (anim === 'petals') s.style.setProperty('--dx', (20 + Math.random() * 60) * (Math.random() < .5 ? -1 : 1) + 'px');
        const dur = anim === 'petals' ? 5 + Math.random() * 3.5 : 2.4 + Math.random() * 3;
        const delay = Math.random() * (anim === 'petals' ? 2.5 : 0.8);
        // both = ระหว่างรอ delay ใช้เฟรมแรกของแอนิเมชัน (กลีบดอกไม้จะยังไม่โผล่ค้างที่ขอบจอ)
        s.style.animation = anim + ' ' + dur + 's ' + (anim === 'petals' ? 'linear ' : 'ease-in ') + delay + 's 1 both';
        layer.append(s);
        setTimeout(() => s.remove(), (dur + delay + 0.6) * 1000);
      }
    }

    function playSound(customUrl) {
      if (customUrl) { playClip(customUrl); return; }
      beep();
    }

    let actx;
    function beep() {
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.connect(g); g.connect(actx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(660, actx.currentTime);
        o.frequency.setValueAtTime(880, actx.currentTime + 0.12);
        g.gain.setValueAtTime(0.0001, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.3, actx.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.55);
        o.start();
        o.stop(actx.currentTime + 0.55);
      } catch (_) {}
    }
  </script>
</body>
</html>
