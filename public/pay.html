<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ชำระเงิน PromptPay · Donate Stream</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <style>
    /* หน้าจ่ายเงินจำลอง — เปิดจากการสแกน QR บนหน้าเติมเงิน (แทนแอปธนาคารระหว่างยังไม่ต่อ payment gateway จริง) */
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: 'IBM Plex Sans Thai', 'Segoe UI', Tahoma, sans-serif; background: #eef2f8; color: #1f2937; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .box { width: 100%; max-width: 380px; background: #fff; border-radius: 20px; box-shadow: 0 20px 50px rgba(15, 23, 42, .12); overflow: hidden; }
    .top { background: #113566; color: #fff; padding: 18px 20px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .pp { background: #fff; color: #113566; border-radius: 6px; padding: 2px 8px; font-weight: 800; font-size: 14px; }
    .body { padding: 22px 20px 24px; text-align: center; }
    .muted { color: #6b7280; font-size: 13px; }
    .to { font-size: 15px; margin: 6px 0 16px; font-weight: 600; }
    .amt { font-size: 40px; font-weight: 700; letter-spacing: -.5px; }
    .ref { margin-top: 10px; font-size: 12px; color: #6b7280; }
    button { width: 100%; height: 48px; margin-top: 22px; border: 0; border-radius: 12px; background: #4c8ef7; color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .note { margin-top: 14px; font-size: 12px; color: #9ca3af; }
    .done { width: 72px; height: 72px; border-radius: 50%; margin: 6px auto 14px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #dcfce7 0 55%, #f0fdf4 56%); }
    .done span { width: 40px; height: 40px; border-radius: 50%; background: #22c55e; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; }
    .err { color: #dc2626; font-weight: 600; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="top"><span class="pp">Prompt<b>Pay</b></span> ชำระเงิน</div>
    <div class="body" id="body"><div class="muted">กำลังโหลด…</div></div>
  </div>
  <script>
    const ref = location.pathname.split('/').filter(Boolean).pop();
    const t = new URLSearchParams(location.search).get('t') || '';
    const body = document.getElementById('body');
    const money = (n) => '฿' + Number(n).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function doneView(text) {
      body.innerHTML = '<div class="done"><span>✓</span></div><div class="to">ชำระเงินสำเร็จ</div><div class="muted">' + text + '</div>';
    }

    fetch('/api/topup/mock-pay/' + encodeURIComponent(ref) + '?t=' + encodeURIComponent(t))
      .then((r) => r.json())
      .then((d) => {
        if (d.error) { body.innerHTML = '<div class="err">' + d.error + '</div>'; return; }
        if (d.status === 'paid') return doneView('รายการนี้ชำระเงินแล้ว');
        if (d.status === 'expired') { body.innerHTML = '<div class="err">รหัส QR หมดอายุแล้ว</div><div class="muted" style="margin-top:6px">กรุณาสร้างรายการเติมเงินใหม่</div>'; return; }
        body.innerHTML = `
          <div class="muted">โอนเงินให้</div>
          <div class="to">Donate Stream · เติม ${Number(d.tokens).toLocaleString('th-TH')} Token</div>
          <div class="muted">จำนวนเงิน</div>
          <div class="amt">${money(d.amount_baht)}</div>
          <div class="ref">รหัสอ้างอิง ${d.reference}</div>
          <button id="pay">ยืนยันการชำระเงิน</button>
          <div class="note">โหมดจำลอง — ไม่มีการตัดเงินจริง</div>`;
        document.getElementById('pay').onclick = async (e) => {
          e.target.disabled = true; e.target.textContent = 'กำลังชำระเงิน…';
          const r = await fetch('/api/topup/mock-pay/' + encodeURIComponent(ref), {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t }),
          }).then((x) => x.json()).catch(() => ({ error: 'เชื่อมต่อไม่สำเร็จ' }));
          if (r.error) { e.target.disabled = false; e.target.textContent = 'ยืนยันการชำระเงิน'; alert(r.error); return; }
          doneView('กลับไปที่หน้าจอคอมพิวเตอร์ของคุณ — Token เข้าบัญชีแล้ว');
        };
      })
      .catch(() => { body.innerHTML = '<div class="err">เชื่อมต่อไม่สำเร็จ</div>'; });
  </script>
</body>
</html>
