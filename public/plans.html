<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แพลน · Donate Stream</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/common.js"></script>

  <div class="container pl-wrap">
    <div class="pl-hero">
      <h1 class="pl-title">เลือกแพลน<br><span>ที่เหมาะกับคุณ</span></h1>
      <div class="pl-sub">
        <p>สมัครสมาชิกแล้ว<b>ใช้ฟรี 21 วัน</b> ทุกฟีเจอร์ —<br>หลังจากนั้นเลือกแพลนเพื่อรับโดเนทต่อได้เลย จ่ายด้วย Token ในกระเป๋า</p>
        <div class="pl-status" id="plStatus"></div>
      </div>
    </div>

    <div class="pl-grid" id="plGrid"></div>

    <p class="muted pl-foot">ซื้อแพลนขณะที่ยังไม่หมดอายุ เวลาที่เหลือจะไม่หาย — ระบบต่อเวลาจากวันหมดอายุเดิมให้ · แพลนหมดอายุ = หน้าโดเนทของคุณปิดรับโดเนทชั่วคราวจนกว่าจะต่ออายุ</p>
  </div>

  <script src="/js/plans.js"></script>
