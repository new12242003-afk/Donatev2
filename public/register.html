<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมัครสมาชิก · Donate Stream</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/common.js"></script>
  <div class="container auth-wrap">
    <aside class="auth-side">
      <div class="auth-side-inner">
        <span class="auth-logo">◆</span>
        <h2>เริ่มรับโดเนทได้ในไม่กี่นาที 🚀</h2>
        <p>สมัครฟรี ใช้ได้ทุกฟีเจอร์ 21 วัน ไม่ต้องผูกบัตร</p>
        <ul>
          <li>🖥️ แจ้งเตือนบน OBS แบบเรียลไทม์</li>
          <li>🔊 AI อ่านข้อความโดเนทภาษาไทย</li>
          <li>✨ สติกเกอร์แอนิเมชันบนจอไลฟ์</li>
          <li>💸 ถอนรายได้เข้าบัญชีพร้อมสลิป</li>
        </ul>
      </div>
    </aside>
    <div class="auth-main">
    <div class="card">
      <h2>สมัครสมาชิก</h2>
      <label>ชื่อผู้ใช้ (username)</label>
      <input id="username" autocomplete="username" placeholder="a-z, 0-9, _ (3-20 ตัว)">
      <label>อีเมล</label>
      <div class="otp-row">
        <input id="email" type="email" autocomplete="email" placeholder="you@gmail.com">
        <button type="button" class="ghost" id="sendCode">ส่งรหัสยืนยัน</button>
      </div>
      <div class="muted otp-hint" id="codeHint" hidden></div>
      <label>รหัสยืนยัน 6 หลัก</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="กด &quot;ส่งรหัสยืนยัน&quot; แล้วใส่รหัสจากอีเมล" class="otp-input">
      <label>รหัสผ่าน (อย่างน้อย 6 ตัว)</label>
      <input id="password" type="password" autocomplete="new-password">
      <label>ยืนยันรหัสผ่าน</label>
      <input id="password2" type="password" autocomplete="new-password" placeholder="กรอกรหัสผ่านอีกครั้ง">
      <div class="pw-match" id="pwMatch" hidden></div>
      <label>ประเภทบัญชี</label>
      <select id="role">
        <option value="donor">ผู้โดเนท — เติมเงินและโดเนทให้สตรีมเมอร์</option>
        <option value="streamer">สตรีมเมอร์ — รับโดเนท + ใช้ Overlay ใน OBS</option>
      </select>
      <div style="margin-top:16px"><button id="go">สมัครสมาชิก</button></div>
      <p class="muted" style="margin-top:10px">มีบัญชีแล้ว? <a href="/login.html">เข้าสู่ระบบ</a></p>
    </div>
    </div>
  </div>

  <script>
    mountNav(null);
    const $ = (id) => document.getElementById(id);
    const sendBtn = $('sendCode');
    const hint = $('codeHint');
    let cooldown = null;

    // ปุ่มส่งรหัส: หลังส่งแล้วนับถอยหลังก่อนให้ขอรหัสใหม่ได้
    function startCooldown(sec) {
      clearInterval(cooldown);
      let left = sec;
      sendBtn.disabled = true;
      sendBtn.textContent = 'ส่งใหม่ใน ' + left + ' วิ';
      cooldown = setInterval(() => {
        left -= 1;
        if (left <= 0) { clearInterval(cooldown); sendBtn.disabled = false; sendBtn.textContent = 'ส่งรหัสอีกครั้ง'; return; }
        sendBtn.textContent = 'ส่งใหม่ใน ' + left + ' วิ';
      }, 1000);
    }

    sendBtn.onclick = async () => {
      const email = $('email').value.trim();
      if (!email) { toast('กรุณากรอกอีเมลก่อน', false); $('email').focus(); return; }
      sendBtn.disabled = true;
      sendBtn.textContent = 'กำลังส่ง…';
      try {
        const r = await api('/auth/register/send-code', { method: 'POST', body: { email } });
        hint.hidden = false;
        hint.innerHTML = r.mailSent
          ? '✅ ส่งรหัสไปที่ <b>' + esc(email) + '</b> แล้ว — ตรวจสอบกล่องจดหมาย (รวมถึง Spam) รหัสหมดอายุใน 10 นาที'
          : '🧪 ยังไม่ได้ตั้งค่าอีเมล (โหมดทดสอบ) — รหัสของคุณคือ <b class="otp-dev">' + esc(r.devCode) + '</b>';
        toast('ส่งรหัสยืนยันแล้ว');
        $('code').focus();
        startCooldown(r.resend_in || 60);
      } catch (e) {
        toast(e.message, false);
        sendBtn.disabled = false;
        sendBtn.textContent = 'ส่งรหัสยืนยัน';
      }
    };

    $('code').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });

    // บอกทันทีระหว่างพิมพ์ว่ารหัสผ่านตรงกันไหม
    const pwMatch = () => {
      const a = $('password').value, b = $('password2').value, box = $('pwMatch');
      box.hidden = !b;
      box.className = 'pw-match ' + (a === b ? 'ok' : 'bad');
      box.textContent = a === b ? '✓ รหัสผ่านตรงกัน' : '✕ รหัสผ่านไม่ตรงกัน';
    };
    $('password').addEventListener('input', pwMatch);
    $('password2').addEventListener('input', pwMatch);

    $('go').onclick = async () => {
      const body = ['username', 'email', 'password', 'role', 'code']
        .reduce((a, k) => (a[k] = $(k).value, a), {});
      if (body.password.length < 6) { toast('รหัสผ่านอย่างน้อย 6 ตัวอักษร', false); $('password').focus(); return; }
      if (body.password !== $('password2').value) { toast('รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน', false); $('password2').focus(); return; }
      if (!/^\d{6}$/.test(body.code)) { toast('กรุณาใส่รหัสยืนยัน 6 หลักจากอีเมล', false); $('code').focus(); return; }
      $('go').disabled = true;
      try {
        await api('/auth/register', { method: 'POST', body });
        toast('สมัครสมาชิกสำเร็จ');
        setTimeout(() => { location.href = '/dashboard.html'; }, 700);
      } catch (e) {
        toast(e.message, false);
        $('go').disabled = false;
      }
    };
  </script>
</body>
</html>
