<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมัครสมาชิก · Donate Stream</title>
  <link rel="icon" href="/img/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/logo-180.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/common.js"></script>
  <div class="container auth-wrap">
    <aside class="auth-side">
      <div class="auth-side-inner">
        <span class="auth-logo"><img src="/img/logo-128.png" alt="" class="logo-img"></span>
        <h2>เริ่มรับ<br><span>โดเนท</span></h2>
        <p>ฟรี 14 วัน ไม่ต้องผูกบัตร</p>
        <ul>
          <li>ขึ้นจอ OBS ทันที</li>
          <li>อ่านออกเสียงภาษาไทย</li>
          <li>สติกเกอร์บนจอไลฟ์</li>
          <li>เงินเข้าบัญชีตรง</li>
        </ul>
      </div>
    </aside>
    <div class="auth-main">
    <div class="card">
      <h2>สมัครสมาชิก</h2>
      <label>ชื่อผู้ใช้ (username)</label>
      <input id="username" autocomplete="username" placeholder="a-z, 0-9, _ (3-20 ตัว)">
      <label>อีเมล</label>
      <div class="otp-row">
        <input id="email" type="email" autocomplete="email" placeholder="you@gmail.com">
        <button type="button" class="ghost" id="sendCode">ขอ OTP</button>
      </div>
      <div class="otp-verified" id="emailOk" hidden>✓ ยืนยันอีเมลแล้ว <button type="button" class="otp-change" id="changeEmail">เปลี่ยนอีเมล</button></div>

      <!-- ขอ OTP แล้วจึงแสดง: ใส่รหัส 6 หลักจากอีเมล → ยืนยัน -->
      <div class="otp-step" id="otpStep" hidden>
        <div class="muted otp-hint" id="codeHint"></div>
        <label>รหัส OTP 6 หลัก</label>
        <div class="otp-row">
          <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="ใส่รหัสจากอีเมล" class="otp-input">
          <button type="button" id="verifyCode">ยืนยัน OTP</button>
        </div>
        <div class="otp-err" id="codeErr" hidden></div>
      </div>
      <label>รหัสผ่าน (อย่างน้อย 6 ตัว)</label>
      <input id="password" type="password" autocomplete="new-password">
      <label>ยืนยันรหัสผ่าน</label>
      <input id="password2" type="password" autocomplete="new-password" placeholder="กรอกรหัสผ่านอีกครั้ง">
      <div class="pw-match" id="pwMatch" hidden></div>
      <!-- เลือกประเภทบัญชีแบบการ์ด (ค่าที่ส่งไปสมัครอยู่ใน #role) -->
      <label id="roleLabel">คุณกำลังสมัครเป็น</label>
      <input type="hidden" id="role" value="streamer">
      <div class="role-cards" role="radiogroup" aria-labelledby="roleLabel">
        <button type="button" class="role-card streamer" data-role="streamer" role="radio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          <b>สตรีมเมอร์</b>
        </button>
        <button type="button" class="role-card donor" data-role="donor" role="radio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          <b>ผู้โดเนท</b>
        </button>
      </div>
      <div style="margin-top:16px"><button id="go">สมัครสมาชิก</button></div>
      <p class="muted" style="margin-top:10px">มีบัญชีแล้ว? <a href="/login.html">เข้าสู่ระบบ</a></p>
    </div>
    </div>
  </div>

  <script>
    mountNav(null);
    const $ = (id) => document.getElementById(id);
    const sendBtn = $('sendCode');
    const hint = $('codeHint');
    let cooldown = null;
    let verifiedEmail = null; // อีเมลที่ยืนยัน OTP ผ่านแล้ว

    // ปุ่มขอ OTP: หลังส่งแล้วนับถอยหลังก่อนให้ขอใหม่ได้
    function startCooldown(sec) {
      clearInterval(cooldown);
      let left = sec;
      sendBtn.disabled = true;
      sendBtn.textContent = 'ขอใหม่ใน ' + left + ' วิ';
      cooldown = setInterval(() => {
        left -= 1;
        if (left <= 0) { clearInterval(cooldown); sendBtn.disabled = false; sendBtn.textContent = 'ขอ OTP อีกครั้ง'; return; }
        sendBtn.textContent = 'ขอใหม่ใน ' + left + ' วิ';
      }, 1000);
    }

    function setCodeErr(text) {
      $('codeErr').textContent = text || '';
      $('codeErr').hidden = !text;
    }

    // สถานะยืนยันอีเมล: ผ่านแล้ว = ล็อกช่องอีเมล ซ่อนขั้น OTP เปิดปุ่มสมัคร
    function setVerified(email) {
      verifiedEmail = email;
      $('email').readOnly = !!email;
      $('emailOk').hidden = !email;
      sendBtn.hidden = !!email;
      if (email) { $('otpStep').hidden = true; clearInterval(cooldown); }
      $('go').disabled = !email;
      $('go').title = email ? '' : 'ยืนยันอีเมลด้วย OTP ก่อน';
    }

    sendBtn.onclick = async () => {
      const email = $('email').value.trim();
      if (!email) { toast('กรุณากรอกอีเมลก่อน', false); $('email').focus(); return; }
      sendBtn.disabled = true;
      sendBtn.textContent = 'กำลังส่ง…';
      try {
        const r = await api('/auth/register/send-code', { method: 'POST', body: { email } });
        hint.innerHTML = r.mailSent
          ? '📩 ส่งรหัสยืนยัน OTP สำเร็จ ตรวจสอบกล่องจดหมาย หรือ Spam <b class="otp-expire">รหัสหมดอายุใน 5 นาที</b>'
          : '🧪 ยังไม่ได้ตั้งค่าอีเมล (โหมดทดสอบ) — OTP ของคุณคือ <b class="otp-dev">' + esc(r.devCode) + '</b>';
        $('otpStep').hidden = false;
        $('code').value = '';
        setCodeErr('');
        $('code').focus();
        toast('ส่ง OTP แล้ว');
        startCooldown(r.resend_in || 60);
      } catch (e) {
        toast(e.message, false);
        sendBtn.disabled = false;
        sendBtn.textContent = 'ขอ OTP';
      }
    };

    async function verifyCode() {
      const email = $('email').value.trim();
      const code = $('code').value;
      if (!/^\d{6}$/.test(code)) { setCodeErr('ใส่ OTP ให้ครบ 6 หลัก'); $('code').focus(); return; }
      const btn = $('verifyCode');
      btn.disabled = true;
      btn.textContent = 'กำลังตรวจ…';
      try {
        await api('/auth/register/verify-code', { method: 'POST', body: { email, code } });
        setCodeErr('');
        setVerified(email.toLowerCase());
        playUiSound('success');
        toast('ยืนยันอีเมลแล้ว');
        $('password').focus();
      } catch (e) {
        setCodeErr(e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'ยืนยัน OTP';
      }
    }
    $('verifyCode').onclick = verifyCode;

    // พิมพ์ครบ 6 หลักแล้วยืนยันให้เลย
    $('code').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
      setCodeErr('');
      if (e.target.value.length === 6) verifyCode();
    });
    $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyCode(); });

    // เปลี่ยนอีเมลหลังยืนยันแล้ว = ต้องขอ OTP ใหม่
    $('changeEmail').onclick = () => {
      setVerified(null);
      sendBtn.disabled = false;
      sendBtn.textContent = 'ขอ OTP';
      $('email').focus();
    };
    setVerified(null);

    // การ์ดประเภทบัญชี: กดเลือก (หรือกดลูกศรซ้าย/ขวา) → เก็บค่าไว้ใน #role
    const roleCards = [...document.querySelectorAll('.role-card')];
    function selectRole(value) {
      $('role').value = value;
      roleCards.forEach((c) => {
        const on = c.dataset.role === value;
        c.classList.toggle('active', on);
        c.setAttribute('aria-checked', on ? 'true' : 'false');
        c.tabIndex = on ? 0 : -1;
      });
    }
    roleCards.forEach((c, i) => {
      c.onclick = () => selectRole(c.dataset.role);
      c.onkeydown = (e) => {
        if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
        e.preventDefault();
        const next = roleCards[(i + (e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 1) + roleCards.length) % roleCards.length];
        selectRole(next.dataset.role);
        next.focus();
      };
    });
    selectRole($('role').value);

    // บอกทันทีระหว่างพิมพ์ว่ารหัสผ่านตรงกันไหม
    const pwMatch = () => {
      const a = $('password').value, b = $('password2').value, box = $('pwMatch');
      box.hidden = !b;
      box.className = 'pw-match ' + (a === b ? 'ok' : 'bad');
      box.textContent = a === b ? '✓ รหัสผ่านตรงกัน' : '✕ รหัสผ่านไม่ตรงกัน';
    };
    $('password').addEventListener('input', pwMatch);
    $('password2').addEventListener('input', pwMatch);

    $('go').onclick = async () => {
      const body = ['username', 'email', 'password', 'role']
        .reduce((a, k) => (a[k] = $(k).value, a), {});
      if (!verifiedEmail) { toast('กรุณายืนยันอีเมลด้วย OTP ก่อน', false); $('email').focus(); return; }
      if (body.password.length < 6) { toast('รหัสผ่านอย่างน้อย 6 ตัวอักษร', false); $('password').focus(); return; }
      if (body.password !== $('password2').value) { toast('รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน', false); $('password2').focus(); return; }
      $('go').disabled = true;
      try {
        await api('/auth/register', { method: 'POST', body });
        toast('สมัครสมาชิกสำเร็จ');
        setTimeout(() => { location.href = '/dashboard.html'; }, 700);
      } catch (e) {
        toast(e.message, false);
        $('go').disabled = false;
        // OTP หมดอายุใน session (เกิน 30 นาที) → ให้ยืนยันใหม่
        if (/OTP/.test(e.message)) setVerified(null);
      }
    };
  </script>
</body>
</html>
